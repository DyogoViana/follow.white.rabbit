  <main>
    <div class="gallery-carousel" id="galleryCarousel" role="region" aria-label="Galeria de imagens" aria-live="polite">
      <figure class="gallery-slide" aria-label="Imagem 1 de 9">
        <img class="gallery-img" src="assets/img/2-Daruma.png" alt="Daruma — tattoo por Dyogo Viana" loading="eager" width="900" height="1200" decoding="async">
        <figcaption class="gallery-text sr-only">
          <p>Junto ao peito, um Daruma, sem pés, a se inclinar:<br>tem eixo — raro — e embaixo o peso mora;<br>um olho aberto, o outro a repousar.<br>No ventre, 叶: o desejo que se cumpre agora;</p>
        </figcaption>
      </figure>

      <figure class="gallery-slide" aria-label="Imagem 2 de 9">
        <img class="gallery-img" src="assets/img/3-Mar.png" alt="Mar — tattoo por Dyogo Viana" loading="lazy" width="900" height="1200" decoding="async">
        <figcaption class="gallery-text sr-only">
          <p>debaixo, o mar faz de cada gesto uma espiral,<br>
          e nada é à toa, mesmo sem saber a hora.<br>
          Há desenho no que ninguém decifrou, e é sinal;<br>
          o futuro, que não controlo, atravesso, leve,<br>
          e o mar segue inteiro, sereno e natural.</p>
        </figcaption>
      </figure>

      <figure class="gallery-slide" aria-label="Imagem 3 de 9">
        <img class="gallery-img" src="assets/img/4-Arabescos.png" alt="Arabescos — tattoo por Dyogo Viana" loading="lazy" width="900" height="1200" decoding="async">
        <figcaption class="gallery-text sr-only">
          <p>Em volta, duas notas num arabesco breve:<br>
          duas cores, uma forma, e o compasso — meu — se expressa;<br>
          juntas, o que bate no peito, em curva, se escreve.</p>
        </figcaption>
      </figure>

      <figure class="gallery-slide" aria-label="Imagem 4 de 9">
        <img class="gallery-img" src="assets/img/5-Fio_da_Ariadne.png" alt="Fio da Ariadne — tattoo por Dyogo Viana" loading="lazy" width="900" height="1200" decoding="async">
        <figcaption class="gallery-text sr-only">
          <p>Na base, ouro em círculos dentro de círculos; o fio começa,<br>
          dá voltas, segue até a luz, só o próximo metro alcança;<br>
          o metro basta, e o resto vem sem pressa.</p>
        </figcaption>
      </figure>

      <figure class="gallery-slide" aria-label="Imagem 5 de 9">
        <img class="gallery-img" src="assets/img/6-Flor.png" alt="Flor — tattoo por Dyogo Viana" loading="lazy" width="900" height="1200" decoding="async">
        <figcaption class="gallery-text sr-only">
          <p>Do lado de fora, onde o dia chega primeiro, a flor avança:<br>
          setembro: primavera — e tudo abre para o dia,<br>
          e a estação é minha, e é só esperança.</p>
        </figcaption>
      </figure>

      <figure class="gallery-slide" aria-label="Imagem 6 de 9">
        <img class="gallery-img" src="assets/img/7-Luz.png" alt="Luz — tattoo por Dyogo Viana" loading="lazy" width="900" height="1200" decoding="async">
        <figcaption class="gallery-text sr-only">
          <p>A luz não some: fica pequena, e é ela que me guia;<br>
          num lado, noite e um ponto aceso; no outro, o céu aberto;<br>
          os dois juntos, e a mesma luz, acesa por si, em harmonia.</p>
        </figcaption>
      </figure>

      <figure class="gallery-slide" aria-label="Imagem 7 de 9">
        <img class="gallery-img" src="assets/img/8-Circulo.png" alt="Círculo — tattoo por Dyogo Viana" loading="lazy" width="900" height="1200" decoding="async">
        <figcaption class="gallery-text sr-only">
          <p>Por inteiro, o braço é um círculo, e o que desce sobe, por certo;<br>
          sem começo, sem ponta, a curva que se fecha em si:<br>
          nada falta, nada sobra, e tudo soa em concerto.<br>
          E, de volta ao começo, estou aqui.</p>
        </figcaption>
      </figure>

      <figure class="gallery-slide" aria-label="Imagem 8 de 9">
        <img class="gallery-img" src="assets/img/9 - inteiro-frente.png"
             alt="Inteiro — frente — tattoo por Dyogo Viana" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-slide" aria-label="Imagem 9 de 9">
        <img class="gallery-img" src="assets/img/10 - inteiro-verso.png"
             alt="Inteiro — verso — tattoo por Dyogo Viana" loading="lazy" decoding="async">
      </figure>
